                <div class="search-product"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Tìm Sản Phẩm..."></div>

            </div>

            <div class="form-bg">
                <div class="addform">
                    <span class="icon"><i class="fa-solid fa-circle-xmark"></i></span>
                    <h2>Thêm Sản Phẩm Mới</h2>
                    <label>Sản Phẩm</label>
                    <input class="inname" type="text" placeholder="Tên Sản Phẩm...">
                    <label>Giá Tiền</label>
                    <input class="inprice" type="number" placeholder="Giá...">
                    <label>Phân Loại</label>
                    <select class="incate">
                        <option value="" disabled selected hidden>Chọn Phân Loại</option>
                        <option value="Bàn Bida">Bàn Bida</option>
                        <option value="Bóng Bida">Bóng Bida</option>
                        <option value="Bao Bida">Bao Bida</option>
                        <option value="Nỉ Bàn">Nỉ Bàn</option>
                        <option value="Cơ Bida">Cơ Bida</option>
                        <option value="Găng Tay">Găng Tay</option>
                        <option value="Lơ Bida">Lơ Bida</option>
                        <option value="Khung Xếp">Khung Xếp</option>
                    </select>
                    <label>Mô Tả</label>
                    <textarea class="indescrip" placeholder="Mô Tả..."></textarea>
                    <label>Hình Ảnh</label>
                    <input class="inimg" type="file">
                
                    <button class="save">Thêm Sản Phẩm</button>
                </div>
            </div>

            <div class="edit-bg">
                <div class="editform">
                    <span class="econ"><i class="fa-solid fa-circle-xmark"></i></span>
                    <h2>Sửa Sản Phẩm</h2>
                    <label>Sản Phẩm</label>
                    <input class="edname" type="text">
                    <label>Giá Tiền</label>
                    <input class="edprice" type="number">
                    <label>Phân Loại</label>
                    <select class="edcate">
                        <option disabled selected>Chọn Phân Loại</option>
                        <option value="Bàn Bida">Bàn Bida</option>
                        <option value="Bóng Bida">Bóng Bida</option>
                        <option value="Bao Bida">Bao Bida</option>
                        <option value="Nỉ Bản">Nỉ Bản</option>
                        <option value="Cơ Bida">Cơ Bida</option>
                        <option value="Găng Tay">Găng Tay</option>
                        <option value="Lơ Bida">Lơ Bida</option>
                        <option value="Khung Xếp">Khung Xếp</option>
                    </select>
                    <label>Mô Tả</label>
                    <textarea class="eddescrip"></textarea>
                    <label>Hình Ảnh</label>
                    <input class="edimg" type="file">
                
                    <button class="update">Cập Nhật Sản Phẩm</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Sản Phẩm</th>
                        <th>Giá</th>
                        <th>Mô Tả</th>
                        <th>Hành Động</th>
                    </tr>
