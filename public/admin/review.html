<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../images/logo bida.png">
    <link rel="stylesheet" href="../css/review.css">
    <link rel="stylesheet" href="../css/slidebar.css">
    <link rel="stylesheet" href="../css/tableadmin.css">
    <link rel="stylesheet" href="../css/thongbao.css">
    <link rel="stylesheet" href="../css/lookup.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ ĐÁNH GIÁ & BÌNH LUẬN</title>
</head>

<body>

<div class="container">

    <div id="slide"></div>

    <div class="main">

        <div class="person">

            <div class="notification">
                <i class="fa-solid fa-bell bell"></i>
                <span class="notification-count"></span>

                <div class="notification-box"></div>

            </div>
        
            <div class="im"></div>
        </div>

        <div class="top">
            <h1>QUẢN LÝ ĐÁNH GIÁ & BÌNH LUẬN</h1>
        </div>

        <div class="table-container">

            <div class="lookUp">

                <div class="search-product"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Tìm Khách Hàng, Sản Phẩm..."></div>
                <div class="filter">
                    <i class="fa-solid fa-filter"></i>

                    <select class="filter-product">
                        <option value="all">Tất Cả</option>
                        <option value="chua">Chưa Phản Hồi</option>
                        <option value="da">Đã Phản Hồi</option>
                        <option value="mot">⭐</option>
                        <option value="hai">⭐⭐</option>
                        <option value="ba">⭐⭐⭐</option>
                        <option value="bon">⭐⭐⭐⭐</option>
                        <option value="nam">⭐⭐⭐⭐⭐</option>
                    </select>
                </div>

                <button class="delete-all"><i class="fa-solid fa-trash"></i> Xóa Tất Cả</button>

            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách Hàng</th>
                        <th>Sản Phẩm</th>
                        <th>Sao</th>
                        <th>Nội Dung</th>
                        <th>Ngày Bình Luận</th>
                        <th>Shop Phản Hồi</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>

                    <tbody class="comment-list"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal">
    <div class="modal-content">
        <h2>Phản Hồi Bình Luận</h2>

        <p class="user-comment"></p>

        <textarea class="shop-reply" placeholder="Nhập phản hồi..."></textarea>

        <div class="modal-actions">
            <button class="send-reply">Gửi</button>
            <button class="close-modal">Đóng</button>
        </div>
    </div>
</div>

<div class="edit-modal">
    <div class="modal-content">
        <h2>Sửa Đánh Giá & Bình Luận</h2>

        <p class="edit-comment-user"></p>

        <textarea class="shop-reply edit-comment-text"
            placeholder="Nhập nội dung bình luận..."></textarea>

        <div class="modal-actions">
            <button class="save-edit">Lưu</button>
            <button class="close-edit">Đóng</button>
        </div>
    </div>
</div>

<div class="confirm-box2">
    <div class="confirm-content2">
        <p>Bạn Có Chắc Muốn Xóa Đánh Giá & Bình Luận Này ?</p>

        <button class="no2">Không</button>
        <button class="yes2">Xác Nhận</button>
    </div>
</div>

<div class="confirm-box-all">
    <div class="confirm-content-all">
        <p>Bạn Có Chắc Muốn Xóa Tất Cả Đánh Giá & Bình Luận Không?</p>
        <button class="no-all">Không</button>
        <button class="yes-all">Xác Nhận</button>
    </div>
</div>

<div class="mgs2"></div>

<script src="../js/review.js"></script>
<script src="../js/loadadmin.js"></script>
<script src="../js/slidebar.js"></script>
<script src="../js/lookup.js"></script>
</body>
</html>
