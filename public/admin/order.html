<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../images/logo bida.png">
    <link rel="stylesheet" href="../css/order.css">
    <link rel="stylesheet" href="../css/slidebar.css">
    <link rel="stylesheet" href="../css/tableadmin.css">
    <link rel="stylesheet" href="../css/thongbao.css">
    <link rel="stylesheet" href="../css/lookup.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ ĐƠN HÀNG</title>
</head>

<body>

<div class="container">

    <div id="slide"></div>

    <div class="main">

        <div class="person">

            <div class="notification">
                <i class="fa-solid fa-bell bell"></i>
                <span class="notification-count"></span>

                <div class="notification-box">
                    <!-- <h3>Thông Báo</h3> -->

                    <!-- <div class="notification-item">
                        <p>Bạn có đơn hàng mới cần xử lý.</p>
                        <span class="notification-time">26/08/2026 - 10:15</span>
                    </div> -->
                    
                </div>
            </div>
        
            <div class="im"></div>
        </div>

        <div class="top">
            <h1>QUẢN LÝ ĐƠN HÀNG</h1>
        </div>

        <div class="table-container">

            <div class="lookUp">

                <div class="search-product"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Tìm Khách Hàng, Mã Đơn..."></div>
                <div class="filter">
                    <i class="fa-solid fa-filter"></i>

                    <select class="filter-product">
                        <option value="all">Tất Cả</option>
                        <option value="cod">COD</option>
                        <option value="qr">QR</option>
                        <option value="cho">Chờ xử Lý</option>
                        <option value="dang">Đang Giao</option>
                        <option value="xong">Hoàn Thành</option>
                        <option value="huy">Đã Hủy</option>
                    </select>
                </div>

            </div>

            <table>
                <thead>
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Khách Hàng</th>
                        <th>Tổng Tiền</th>
                        <th>Ngày Đặt</th>
                        <th>Phương Thức</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>

                <!-- <tr>
                    <td>1</td>
                    <td>DH001</td>
                    <td>Nguyễn Văn A</td>
                    <td>80.000.000 VNĐ</td>
                    <td>15/05/2026</td>
                    <td><b>Chuyển khoản</b></td>
                    <td>
                        <select onchange="tt(this)">
                            <option value="cho">Chờ xử lý</option>
                            <option value="dang">Đang giao</option>
                            <option value="xong">Hoàn thành</option>
                            <option value="huy">Đã hủy</option>
                        </select>
                    </td>
                    <td>
                        <button class="edit"><i class="fa-solid fa-eye"></i> Chi tiết</button>
                        <button class="delete"><i class="fa-solid fa-trash-can"></i> Xóa</button>
                    </td>
                </tr> -->

                <tbody class="order-list"></tbody>
            </table>
        </div>
        <div class="box">
            <div class="invoice-box">
                <span class="econ"><i class="fa-solid fa-circle-xmark"></i></span>
                <div class="invoice-title">
                    <span><b>Mã Đơn:</b> <b class="id"></b></span>
                </div>

                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-user"></i> <b>Người Nhận: <span class="name"></span></b></span>
                </div>

                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-envelope"></i> <b>Email: <span class="email"></span></b></span>
                </div>
                
                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-phone"></i> <b>Số Điện Thoại: <span class="phone"></span></b></span>
                </div>

                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-location-dot"></i> <b>Địa Chỉ Nhận: <span class="address"></span></b></span>
                </div>

                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-credit-card"></i> <b>Phương Thức: <span class="method"></span></b></span>
                </div>

                <div class="invoice-row bank-row">
                    <span class="label">
                        <i class="tt fa-solid fa-building-columns"></i>
                        <b>Ngân Hàng: <span class="bank-name"></span></b>
                    </span>
                </div>

                <div class="invoice-row bank-row">
                    <span class="label">
                        <i class="tt fa-solid fa-money-check"></i>
                        <b>Số Tài Khoản: <span class="bank-account"></span></b>
                    </span>
                </div>

                <div class="invoice-row">
                    <span class="label"><i class="tt fa-solid fa-clock"></i> <b>Thời Gian: <span class="time"></span></b></span>
                </div>

                <div class="product-list">
                    <!-- <div class="product-item">
                        <div class="product-info">
                            <img src="../images/lơ taom.png" alt="Ảnh" class="product-img">
                            <div class="product-detail">
                                <h3 class="product-name">Cục Lơ TAOM</h3>
                                <h4 class="product-qty">Số lượng: x1</h4>
                            </div>
                        </div>
                        <span class="product-price">450.000 VNĐ</span>
                    </div> -->
                </div>

                <div class="invoice-roww" style="margin-top: 10px;">
                    <span class="label">Phí vận chuyển: 30.000 VNĐ</span>
                </div>
                
                <div class="total-row">
                    <span class="tong"><i class="fa-solid fa-circle-dollar-to-slot"></i> TỔNG THANH TOÁN:</span>
                    <span class="price"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="confirm-box2">
    <div class="confirm-content2">
        <p>Bạn Có Chắc Muốn Hủy Đơn Hàng Này?</p>

        <button class="no2">Không</button>
        <button class="yes2">Xác Nhận</button>
    </div>
</div>

<div class="mgs2"></div>

<script src="../js/order.js"></script>
<script src="../js/loadadmin.js"></script>
<script src="../js/slidebar.js"></script>
<script src="../js/lookup.js"></script>
</body>
</html>
