<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/logo bida.png">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/canhan.css">
    <link rel="stylesheet" href="css/thongbao.css">
    <title>CÁ NHÂN</title>
</head>
<body>
    <div id="header"></div>

    
    <section class="profile">
        <div class="choose">
            <div class="picture"></div>
            <p class="cn active">Thông Tin Cá Nhân</p>
            <p class="mk">Đổi Mật Khẩu</p>
        </div>

        <div class="info">
            <div class="tt">
                <h2>Thông Tin Cá Nhân</h2>
                <div class="line"></div>
                <div class="ttt">
                    <label>Tên</label>
                    <div class="edit">
                        <p class="name"></p>
                        <i class="fa-solid fa-pen edit-name"></i>
                    </div>
                    <label>Email</label>
                    <div class="edit">
                        <p class="email"></p>
                        <i class="fa-solid fa-pen edit-email"></i>
                    </div>
                    <label>Số Điện Thoại</label>
                    <div class="edit">
                        <p class="phone"></p>
                        <i class="fa-solid fa-pen edit-phone"></i>
                    </div>
                  
                </div>
                <button class="save"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            </div>

            <div class="dmk">
                <h2>Đổi Mật Khẩu</h2>
                <div class="line"></div>
                <div class="dmkk">
                    <label>Mật Khẩu Hiện Tại</label>
                    <input class="oldpass" type="password" placeholder="Nhập mật khẩu hiện tại..." required>
                    <i class="fa-solid fa-eye eye-old"></i>

                    <label>Mật Khẩu Mới</label>
                    <input class="newpass" type="password" placeholder="Nhập mật khẩu mới..." required>
                    <i class="fa-solid fa-eye eye-new"></i>
                    
                </div>
                <button class="update"><i class="fa-solid fa-arrows-rotate"></i> Cập Nhật</button>
            </div>
        </div>
    </section>

    <div class="mgs"></div>

    <div id="footer"></div>

    <script src="js/load.js"></script>
    <script src="js/header.js"></script>
    <script src="js/canhan.js"></script>

</body>
</html>
