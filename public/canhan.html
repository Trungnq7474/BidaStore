<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/logo bida.png">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/canhan.css">
    <link rel="stylesheet" href="css/thongbao.css">
    <title>CÁ NHÂN</title>
</head>
<body>
    <div id="header"></div>

    
    <section class="profile">
        <div class="choose">
            <div class="picture"></div>
            <p class="tq">Tổng Quan Mua Hàng</p>
            <p class="cn active">Thông Tin Cá Nhân</p>
            <p class="mk">Đổi Mật Khẩu</p>
            <p class="dc">Địa Chỉ Cá Nhân</p>
        </div>

        <div class="info">

            <div class="tongquan">
                <h2>Tổng Quan Mua Hàng</h2>
                <div class="line"></div>

                <div class="overview">
                    <div class="overview-item">
                        <i class="fa-solid fa-box"></i>
                        <div>
                            <p>Sản Phẩm Đã Mua</p>
                            <strong class="total-product">0</strong>
                        </div>
                    </div>

                    <div class="overview-item">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <div>
                            <p>Tổng Đơn Hàng</p>
                            <strong class="total-order">0</strong>
                        </div>
                    </div>

                    <div class="overview-item">
                        <i class="fa-solid fa-sack-dollar"></i>
                        <div>
                            <p>Tổng Tiền Đã Mua</p>
                            <strong class="total-money">0</strong>
                        </div>
                    </div>

                    <div class="overview-item">
                        <i class="fa-solid fa-clipboard-check"></i>
                        <div>
                            <p>Đơn Hoàn Thành</p>
                            <strong class="total-complete">0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tt">
                <h2>Thông Tin Cá Nhân</h2>
                <div class="line"></div>
                <div class="ttt">
                    <label>Tên</label>
                    <div class="edit">
                        <p class="name"></p>
                        <i class="fa-solid fa-pen edit-name"></i>
                    </div>
                    <label>Email</label>
                    <div class="edit">
                        <p class="email"></p>
                        <i class="fa-solid fa-pen edit-email"></i>
                    </div>
                    <label>Số Điện Thoại</label>
                    <div class="edit">
                        <p class="phone"></p>
                        <i class="fa-solid fa-pen edit-phone"></i>
                    </div>
                  
                </div>
                <button class="save"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            </div>

            <div class="dmk">
                <h2>Đổi Mật Khẩu</h2>
                <div class="line"></div>
                <div class="dmkk">
                    <label>Mật Khẩu Hiện Tại</label>
                    <input class="oldpass" type="password" placeholder="Nhập mật khẩu hiện tại..." required>
                    <i class="fa-solid fa-eye eye-old"></i>

                    <label>Mật Khẩu Mới</label>
                    <input class="newpass" type="password" placeholder="Nhập mật khẩu mới..." required>
                    <i class="fa-solid fa-eye eye-new"></i>
                    
                </div>
                <button class="update"><i class="fa-solid fa-arrows-rotate"></i> Cập Nhật</button>
            </div>

            <div class="diachi">

                <h2>Địa Chỉ Cá Nhân</h2>

                <div class="line"></div>

                <div class="address-list">

                    <!-- <div class="address-item">
                        <div class="address-content">
                            <div class="address-top">
                                <strong>Nguyễn Văn A</strong>
                                <span class="default-tag">Mặc định</span>
                            </div>

                            <p>0901234567</p>
                            <p>123 Nguyễn Trãi, Phường Bến Thành, Thành phố Hồ Chí Minh</p>
                        </div>

                        <div class="address-action">
                            <button class="edit-address"><i class="fa-solid fa-pen"></i> Sửa</button>
                            <button class="delete-address"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </div>
                    </div> -->

                </div>

                <button class="show-address-form"><i class="fa-solid fa-plus"></i> Thêm Địa Chỉ</button>
                

                <div class="address-overlay"></div>

                <div class="address-form-box">

                    <h3>Thêm Địa Chỉ Mới</h3>

                    <div class="address-form">

                        <label>Họ Và Tên</label>
                        <input type="text" class="address-name" placeholder="Nhập Họ Và Tên...">

                        <label>Số Điện Thoại</label>
                        <input type="text" class="address-phone" placeholder="Nhập Số Điện Thoại...">

                        <label>Địa Chỉ</label>
                        <input type="text" class="address-detail" placeholder="Nhập Số Nhà, Tên Đường...">

                        <label>Tỉnh / Thành Phố</label>
                        <select class="address-city">
                            <option value="">-- Chọn Tỉnh / Thành Phố --</option>
                        </select>

                        <label>Xã / Phường / Đặc Khu</label>
                        <select class="address-ward">
                            <option value="">-- Chọn Xã / Phường / Đặc Khu --</option>
                        </select>

                        <label class="default-address">
                            <input type="checkbox"> Đặt Làm Địa Chỉ Mặc Định
                        </label>

                    </div>

                    <div class="address-buttons">

                        <button class="cancel-address"> Hủy</button>

                        <button class="add-address"><i class="fa-solid fa-floppy-disk"></i> Lưu Địa Chỉ</button>

                    </div>

                </div>

            </div>

        </div>
    </section>

    <div class="mgs"></div>

    <div id="footer"></div>

    <script src="js/load.js"></script>
    <script src="js/header.js"></script>
    <script src="js/canhan.js"></script>

</body>
</html>
