<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="images/logo bida.png">
    <link rel="stylesheet" href="css/registerandlogin.css">
    <link rel="stylesheet" href="css/thongbao.css">
    <title>ĐĂNG KÍ</title>
</head>
<body>
    <form class="dk" action="/register" method="post">
        <h1>ĐĂNG KÍ</h1>
        <input type="text" name="email" placeholder="Nhập email...">
        <i class="fa-solid fa-envelope"></i>
        <div class="error email-error"></div>

        <input type="text" class="dkname" name="username" placeholder="Nhập tên...">
        <i class="fa-solid fa-user"></i>
        <div class="error username-error"></div>

        <input type="tel" name="phone" placeholder="Nhập số điện thoại...">
        <i class="fa-solid fa-phone"></i>
        <div class="error phone-error"></div>

        <input type="password" class="dkpass" name="password" placeholder="Nhập mật khẩu...">
        <i class="fa-solid fa-eye eye"></i>
        <div class="error password-error"></div>

        <button class="btn">ĐĂNG KÍ</button>
        <p>Bạn đã có tài khoản ? <a href="login.html">Đăng Nhập</a></p>
    </form>

<div class="mgs"></div>

<script src="js/register.js"></script>
</body>
</html>
